name: 更新贡献动画

"on":
  schedule:
    # UTC 01:20，即北京时间 09:20。
    - cron: '20 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: 从真实贡献记录生成动画
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            asset/contributions.svg?color_snake=#f6b94a&color_dots=#161b22,#5b3541,#ae536d,#ed8660,#f6b94a
            asset/contributions-light.svg?color_snake=#c66a05&color_dots=#ebedf0,#5b3541,#ae536d,#ed8660,#f6b94a

      - name: 仅更新生成的图片
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset/contributions.svg asset/contributions-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: 更新贡献动画'
          git pull --rebase origin main
          git push origin HEAD:main
